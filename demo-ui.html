<title>Affilio Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sidebar trên nền, khung làm việc là một tấm panel bo nhẹ; màn duyệt dùng 3 cột + timeline */
:root{
  --bg:#f4f4f9; --surface:#ffffff; --surface-2:#f3f3f8; --ink:#1b1b2e; --muted:#62657d; --line:#e2e2ee;
  --accent:#4f46e5; --accent-ink:#ffffff; --accent-soft:#ecebfd;
  --ok:#147a3c; --ok-soft:#e1f4e7; --warn:#a75a06; --warn-soft:#fcefd9; --bad:#c22a2a; --bad-soft:#fce5e5;
  --info:#0c679f; --info-soft:#dff0fa; --neutral-soft:#ebebf2;
  --phone-bg:#0c0c14; --phone-ink:#ffffff; --phone-sub:#ffe14d; --scrim:rgba(15,15,30,.45);
  --shadow:0 1px 2px rgba(20,20,50,.06),0 8px 24px rgba(20,20,50,.06);
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0e16; --surface:#16161f; --surface-2:#1d1d29; --ink:#e7e7f3; --muted:#9a9cb4; --line:#2a2a3a;
  --accent:#8f89ff; --accent-ink:#0f0f1a; --accent-soft:#242250;
  --ok:#4ad888; --ok-soft:#14301f; --warn:#f5b941; --warn-soft:#352812; --bad:#f47b7b; --bad-soft:#391818;
  --info:#62b9ef; --info-soft:#122b3c; --neutral-soft:#262634; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e0e16; --surface:#16161f; --surface-2:#1d1d29; --ink:#e7e7f3; --muted:#9a9cb4; --line:#2a2a3a;
  --accent:#8f89ff; --accent-ink:#0f0f1a; --accent-soft:#242250;
  --ok:#4ad888; --ok-soft:#14301f; --warn:#f5b941; --warn-soft:#352812; --bad:#f47b7b; --bad-soft:#391818;
  --info:#62b9ef; --info-soft:#122b3c; --neutral-soft:#262634; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;font-weight:700} h2{font-size:16px;font-weight:600} h3{font-size:14px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:12.5px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}

/* ---------- khung ứng dụng ---------- */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px;min-height:100vh;
  padding-block:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:12px;align-self:start;display:flex;flex-direction:column;gap:2px;height:calc(100vh - 24px);padding:4px 4px 8px}
.brand{display:flex;align-items:center;gap:10px;padding:8px 10px 16px;font-weight:700;font-size:16px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;min-height:38px}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nav a .cnt{margin-left:auto;font-size:12px;background:var(--accent-soft);color:var(--accent);padding:0 7px;border-radius:99px;font-weight:600}
.nav .sep{height:1px;background:var(--line);margin:8px 10px}
.side .foot{margin-top:auto;padding:10px;font-size:12px;color:var(--muted)}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}

.main{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:calc(100vh - 24px)}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top .menu{display:none}
.chsw{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 4px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.chsw select{border:0;background:transparent;font-weight:600;padding:4px 2px;max-width:220px}
.plat{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;background:var(--ink);color:var(--surface)}
.quota{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:12.5px;color:var(--muted)}
.meter{width:110px;height:6px;border-radius:99px;background:var(--neutral-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.sample{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.view{padding:20px;display:flex;flex-direction:column;gap:20px;flex:1;min-width:0}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head .sub{color:var(--muted);margin-top:2px}
.head .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- thành phần chung ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);color:var(--surface);border-color:transparent}
.btn.bad{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.sm{min-height:30px;padding:0 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
kbd{font-family:var(--f-mono);font-size:11px;padding:1px 5px;border-radius:4px;border:1px solid currentColor;opacity:.75}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--neutral-soft);color:var(--muted)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--info-soft);color:var(--info)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.spin::before{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.badge{font-size:11px;padding:1px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.warn{border-color:var(--warn);color:var(--warn)} .badge.bad{border-color:var(--bad);color:var(--bad)} .badge.acc{border-color:var(--accent);color:var(--accent)}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px;min-width:0}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile .big{font-size:28px;font-weight:700;letter-spacing:-.02em}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:500;font-size:13px}
.field .hint{font-size:12px;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;min-height:38px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
textarea.inp{min-height:84px;resize:vertical}
.inp::placeholder{color:var(--muted);opacity:.8}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:10px 12px;background:var(--surface-2);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.thumb{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;
  background:hsl(var(--h) 70% 88%);color:hsl(var(--h) 55% 30%)}
:root[data-theme="dark"] .thumb{background:hsl(var(--h) 35% 24%);color:hsl(var(--h) 70% 82%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .thumb{background:hsl(var(--h) 35% 24%);color:hsl(var(--h) 70% 82%)}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;cursor:pointer;min-height:30px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:40px 16px;color:var(--muted)}
.empty .ic{width:32px;height:32px}
.empty h3{color:var(--ink)}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--neutral-soft),var(--surface-2),var(--neutral-soft));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.err{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r);background:var(--bad-soft);color:var(--bad)}
.err .txt{color:var(--ink);flex:1}
.warnbox{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.warnbox span{color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border:1px solid var(--line);border-radius:8px;min-height:42px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 9px;border-radius:6px;background:var(--surface-2);font-size:13px}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag button{border:0;background:transparent;cursor:pointer;width:22px;height:22px;border-radius:4px;color:inherit;opacity:.7}
.tag button:hover{opacity:1;background:var(--neutral-soft)}
.tags input{border:0;outline:0;background:transparent;flex:1;min-width:120px;padding:4px}

.toast{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast div{background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:9px;box-shadow:var(--shadow);font-weight:500;max-width:340px;animation:tin .2s ease-out}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

/* ---------- dashboard ---------- */
.spark{width:100%;height:40px;display:block}
.spark .a{fill:var(--accent-soft)} .spark .l{fill:none;stroke:var(--accent);stroke-width:2} .spark .d{fill:var(--accent)}
.chrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 70px 70px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.chrow:first-of-type{border-top:0}
.hook-quote{font-size:17px;font-weight:600;line-height:1.4;border-left:3px solid var(--accent);padding-left:12px}

/* ---------- kênh / định hướng ---------- */
.dir{display:grid;grid-template-columns:170px minmax(0,1fr) 330px;gap:20px;align-items:start}
.dir-nav{position:sticky;top:12px;display:flex;flex-direction:column;gap:2px}
.dir-nav a{padding:6px 10px;border-radius:6px;color:var(--muted);text-decoration:none;font-size:13px;cursor:pointer}
.dir-nav a:hover{background:var(--surface-2);color:var(--ink)}
details.sec{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);scroll-margin-top:12px}
details.sec summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:600}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary .ic{transition:transform .15s;color:var(--muted)}
details.sec[open] summary .ic{transform:rotate(90deg)}
details.sec summary .muted{font-weight:400;font-size:12.5px;margin-left:auto}
details.sec .body{padding:0 16px 16px;display:grid;gap:14px}
.dir-side{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
pre.prompt{margin:0;white-space:pre-wrap;word-break:break-word;background:var(--surface-2);border-radius:8px;padding:12px;max-height:340px;overflow:auto;font-family:var(--f-mono);font-size:12px;line-height:1.55}
.tokbar{height:6px;border-radius:99px;background:var(--neutral-soft);overflow:hidden}
.tokbar i{display:block;height:100%;background:var(--ok)}
.drawer-scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:41;border-left:1px solid var(--line);
  display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 16px;gap:14px;overflow:auto}
.ver{border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:grid;gap:2px}
.ver.on{border-color:var(--accent);background:var(--accent-soft)}
.diff{font-family:var(--f-mono);font-size:12px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.diff div{padding:3px 10px;white-space:pre-wrap}
.diff .add{background:var(--ok-soft);color:var(--ok)} .diff .del{background:var(--bad-soft);color:var(--bad)}
.voice-wave{display:inline-flex;gap:2px;align-items:center;height:18px}
.voice-wave i{width:3px;background:var(--accent);border-radius:2px;animation:wv .8s infinite ease-in-out}
.voice-wave i:nth-child(2){animation-delay:.1s}.voice-wave i:nth-child(3){animation-delay:.2s}.voice-wave i:nth-child(4){animation-delay:.3s}
@keyframes wv{0%,100%{height:4px}50%{height:16px}}

/* ---------- sản phẩm ---------- */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted);display:grid;gap:6px;place-items:center;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--line)}
.dot.on{background:var(--ok)}

/* ---------- batch ---------- */
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.pick label{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;min-height:56px}
.pick label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.pick input{accent-color:var(--accent);width:16px;height:16px}
.fmt-pick label{flex-direction:column;align-items:flex-start;gap:2px}
.prog{height:6px;border-radius:99px;background:var(--neutral-soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* ---------- hộp duyệt ---------- */
.inbox{display:grid;grid-template-columns:270px minmax(0,1fr) 330px;grid-template-areas:"list stage panel" "list tl tl";gap:16px;align-items:start}
.ib-list{grid-area:list;display:flex;flex-direction:column;gap:10px;min-width:0}
.ib-stage{grid-area:stage;display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.ib-panel{grid-area:panel;display:flex;flex-direction:column;gap:12px;min-width:0}
.ib-tl{grid-area:tl;min-width:0}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.filters select{min-height:34px;font-size:13px;padding:4px 8px}
.grp{font-size:12px;font-weight:600;color:var(--muted);padding:8px 2px 2px;display:flex;align-items:center;gap:8px}
.item{display:grid;gap:4px;padding:10px;border-radius:9px;border:1px solid transparent;cursor:pointer;text-align:left;background:transparent;width:100%}
.item:hover{background:var(--surface-2)}
.item.on{border-color:var(--accent);background:var(--accent-soft)}
.item .t{font-weight:500;font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .m{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.var{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:0 6px;border-radius:4px;background:var(--ink);color:var(--surface)}
.phone{width:min(270px,100%);aspect-ratio:9/19;max-width:100%;border-radius:34px;padding:10px;background:var(--phone-bg);box-shadow:var(--shadow);border:1px solid var(--line)}
.screen{position:relative;width:100%;height:100%;border-radius:26px;overflow:hidden;color:var(--phone-ink);
  background:radial-gradient(120% 70% at 50% 35%,hsl(var(--h) 45% 32%),hsl(var(--h) 35% 10%))}
.ph-top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;font-size:11px;opacity:.85}
.ph-hook{position:absolute;top:42px;left:12px;right:12px;font-weight:700;font-size:15px;line-height:1.25;text-align:center;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.ph-visual{position:absolute;top:30%;left:50%;transform:translateX(-50%);width:58%;aspect-ratio:1;border-radius:18px;display:grid;place-items:center;
  background:hsl(var(--h) 60% 80%);color:hsl(var(--h) 60% 20%);font-weight:700;font-size:28px;transition:transform .3s}
.ph-visual small{position:absolute;bottom:-22px;font-size:10px;color:var(--phone-ink);opacity:.75;font-weight:500;white-space:nowrap}
.ph-sub{position:absolute;bottom:62px;left:12px;right:12px;text-align:center;font-weight:700;font-size:16px;line-height:1.25;color:var(--phone-sub);
  text-shadow:0 0 1px #000,0 2px 0 #000,2px 0 0 #000,-2px 0 0 #000,0 -2px 0 #000}
.mascot{position:absolute;bottom:110px;left:10px;width:46px;height:46px;border-radius:50%;background:#f4a340;border:2px solid #fff}
.mascot::before,.mascot::after{content:"";position:absolute;top:-8px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid #f4a340}
.mascot::before{left:3px;transform:rotate(-18deg)} .mascot::after{right:3px;transform:rotate(18deg)}
.mascot i{position:absolute;top:17px;width:6px;height:8px;border-radius:50%;background:#1a1a1a}
.mascot i:first-child{left:12px} .mascot i:last-child{right:12px}
.mascot.talk{animation:bob .5s infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.ph-bar{position:absolute;bottom:18px;left:14px;right:14px;height:3px;border-radius:2px;background:rgba(255,255,255,.25)}
.ph-bar i{display:block;height:100%;background:var(--phone-ink);border-radius:2px}
.ph-play{position:absolute;inset:0;border:0;background:transparent;cursor:pointer}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.actions .btn{min-height:42px}
.score{display:flex;align-items:center;gap:14px}
.ring{--v:80;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;
  background:radial-gradient(closest-side,var(--surface) 76%,transparent 78%),conic-gradient(var(--accent) calc(var(--v)*1%),var(--neutral-soft) 0)}
.bars{display:grid;gap:6px;flex:1}
.bars div{display:grid;grid-template-columns:100px 1fr 28px;gap:8px;align-items:center;font-size:12px}
.hb{height:6px;border-radius:99px;background:var(--neutral-soft);overflow:hidden}
.hb i{display:block;height:100%;background:var(--accent)}
.rule{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:4px 0}
.rule .ic{width:16px;height:16px;margin-top:2px}
.rule.ok .ic{color:var(--ok)} .rule.bad .ic{color:var(--bad)} .rule.warn .ic{color:var(--warn)}
.script{font-size:13px;display:grid;gap:6px}

function spark(vals){
  const w=120,h=40,max=Math.max(...vals,1),step=w/(vals.length-1);
  const pts=vals.map((v,i)=>[i*step,h-4-(v/max)*(h-10)]);
  const line=pts.map(p=>p.join(',')).join(' ');
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="-2 0 ${w+6} ${h}" preserveAspectRatio="none" aria-hidden="true"><polygon class="a" points="0,${h} ${line} ${w},${h}"/><polyline class="l" points="${line}"/><circle class="d" cx="${last[0]}" cy="${last[1]}" r="3"/></svg>`;
}

function buildBrief(){
  const p=prof(),c=chan(),pr=P(S.sampleProduct);
  const L=[];
  L.push(`[ĐỊNH HƯỚNG KÊNH] ${c.name} (${c.handle}) · v${c.version}${S.dirty?' + thay đổi chưa lưu':''}`);
  L.push(`Ngách: ${c.niche}`);
  if(p.positioning)L.push(`Định vị: ${p.positioning}`);
  if(p.audience)L.push(`Khán giả: ${p.audience}`);
  if(p.tone)L.push(`Giọng: ${p.tone}. ${p.persona}`);
  if(p.pillars.length)L.push(`Trụ nội dung: ${p.pillars.join(', ')}`);
  if(p.banned.length)L.push(`KHÔNG dùng từ: ${p.banned.join(', ')}`);
  if(p.bannedTopics.length)L.push(`KHÔNG nói về: ${p.bannedTopics.join(', ')}`);
  if(p.claim)L.push(`Khẳng định: ${p.claim}`);
  L.push(`CTA (${p.ctaStyle}): ${p.ctaPhrases||'tự chọn'}`);
  L.push(`Thời lượng ${p.durMin}–${p.durMax} giây. Định dạng ưu tiên: ${p.formats.join(', ')||'AI chọn'}`);
  if(p.series)L.push(`Series: "${p.series}", tập ${p.episode}`);
  if(p.examples)L.push(`Ví dụ giọng kênh:\n${p.examples}`);
  L.push('');
  L.push(`[SẢN PHẨM] ${pr.name} · ${vnd(pr.price)}`);
  (pr.facts||[]).forEach(f=>L.push(`- ${f}`));
  L.push('');
  L.push('Viết kịch bản 5 cảnh: hook ≤ 8 chữ, 3 ý, 1 CTA. Trả JSON theo schema Scene.');
  return L.join('\n');
}

function inboxList(){
  return DRAFTS.filter(d=>d.channel===S.channel&&(S.filter.status==='all'||d.status===S.filter.status)&&(S.filter.format==='all'||d.format===S.filter.format));
}
function cur(){return DRAFTS.find(d=>d.id===S.sel)}
function rulesFor(d){
  const p=prof(),total=d.scenes.reduce((a,s)=>a+s.dur,0);
  const r=[{t:'ok',m:'Không có từ cấm của kênh'},{t:total>=p.durMin&&total<=p.durMax?'ok':'bad',m:`Thời lượng ${total} giây (kênh: ${p.durMin}–${p.durMax})`},{t:'ok',m:'Giá trong video khớp giá sản phẩm'}];
  if(d.profile<chan().version)r.push({t:'warn',m:`Viết theo định hướng v${d.profile}, kênh đang dùng v${chan().version}`});
  return r.concat(d.rules||[]);
}
const BADGE={'old channel direction':['Định hướng cũ','warn'],'AI images':['Ảnh AI',''],'my voice':['Giọng của tôi','acc'],'failed, retry':['Lỗi, thử lại','bad']};
const badges=d=>d.badges.map(b=>`<span class="badge ${BADGE[b][1]}">${BADGE[b][0]}</span>`).join('');
V.inbox=()=>{
  const list=inboxList();
  if(list.length&&!list.find(d=>d.id===S.sel))S.sel=list[0].id;
  const d=list.find(x=>x.id===S.sel);

      ${list.filter(x=>x.product===g).map(x=>`<button class="item ${x.id===S.sel?'on':''}" data-act="pick" data-id="${x.id}"><span class="m"><span class="var">${x.variant}</span>${chip(x.status)}<span class="muted num" style="margin-left:auto;font-size:11.5px">${x.ago}</span></span><span class="t">${esc(x.hook)}</span><span class="m">${badges(x)}</span></button>`).join('')}</div>`).join('')
      :`<div class="empty">${ic('check')}<h3>Hết nháp cần duyệt</h3><p>Không có nháp nào khớp bộ lọc này.</p></div>`}

    <div class="act"><a class="btn" href="#editor" data-act="toEditor">${ic('film')}Mở trong trình chỉnh</a></div></div>
  <div class="inbox">${left}
    <div class="ib-stage">
      ${d.status==='failed'?`<div class="err" style="width:100%">${ic('alert')}<div class="txt"><b>Không dựng được video.</b> ${esc(d.error)}</div><button class="btn sm" data-act="retry" data-id="${d.id}">${ic('refresh')}Thử lại</button></div>`:''}
      <div class="phone"><div class="screen" style="--h:${P(d.product).h}">
        <div class="ph-top"><span>${esc(chan().handle)}</span><span class="num" id="phTime">0:00 / 0:${String(total).padStart(2,'0')}</span></div>
        <div class="ph-hook">${esc(d.hook)}</div>
        <div class="ph-visual" id="phVis">${esc(P(d.product).name.split(' ').slice(0,2).map(w=>w[0]).join(''))}<small id="phVisL">${esc(sc[S.scene].visual)}</small></div>
        <div class="mascot ${S.playing?'talk':''}" id="mascot"><i></i><i></i></div>
        <div class="ph-sub" id="phSub">${esc(sc[S.scene].text)}</div>
        <div class="ph-bar"><i id="phBar" style="width:${S.t/total*100}%"></i></div>
        <button class="ph-play" data-act="play" aria-label="${S.playing?'Tạm dừng':'Phát'} video"></button>
      </div></div>
      <div class="actions">
        <button class="btn ok" data-act="approve" ${canAct?'':'disabled'}>${ic('check')}Duyệt <kbd>A</kbd></button>
        <button class="btn bad" data-act="reject" ${canAct?'':'disabled'}>${ic('x')}Loại <kbd>R</kbd></button>
        <button class="btn" data-act="note" ${d.status==='failed'?'disabled':''}>${ic('pen')}Ghi chú <kbd>N</kbd></button>
      </div>
      <div class="kbd-help"><span><kbd>J</kbd> nháp sau</span><span><kbd>K</kbd> nháp trước</span><span><kbd>Space</kbd> phát/dừng</span></div>
    </div>
    <div class="ib-panel">
      ${S.noteOpen?`<form class="notebox" data-form="note"><label for="noteTxt"><b>Ghi chú cho AI</b></label><textarea class="inp" id="noteTxt" placeholder="Ví dụ: Hook dài quá, cắt còn dưới 8 chữ. Cảnh 3 dùng clip của tôi.">${esc(d.note||'')}</textarea>
        <div class="row"><button class="btn pri" type="submit">${ic('spark')}AI sửa theo ghi chú</button><button class="btn ghost" type="button" data-act="noteClose">Huỷ</button></div>
        <span class="muted" style="font-size:12px">Cảnh có biểu tượng khoá sẽ được giữ nguyên.</span></form>`:(d.note?`<div class="warnbox">${ic('pen')}<span><b>Ghi chú trước:</b> ${esc(d.note)}</span></div>`:'')}
      <section class="card"><div class="row" style="margin-bottom:10px"><span class="var">${d.variant}</span><b>${esc(d.format)}</b>${chip(d.status)}</div><div class="row">${badges(d)}<span class="badge">Định hướng v${d.profile}</span></div></section>
      <section class="card"><div class="score"><div class="ring num" style="--v:${d.score}">${d.score||'–'}</div><div class="bars">

/* ---- trình chỉnh video ---- */
V.editor=()=>{
  const d=DRAFTS.find(x=>x.id===S.edDraft)||DRAFTS[0],sc=d.scenes,total=sc.reduce((a,s)=>a+s.dur,0),s=sc[S.edScene];
  let acc=0;const pos=sc.map(x=>{const st=acc;acc+=x.dur;return [st/total*100,x.dur/total*100]});
  const lane=(cls,fn)=>sc.map((x,i)=>`<div class="blk ${cls} ${i===S.edScene?'cur':''}" data-act="edScene" data-i="${i}" style="left:${pos[i][0]}%;width:calc(${pos[i][1]}% - 3px)" title="${esc(fn(x))}">${cls==='scene'&&x.locked?ic('lock'):''}${esc(fn(x))}</div>`).join('');
  return `<div class="head"><div><h1>Chỉnh video</h1><p class="sub">${esc(P(d.product).name)} · biến thể ${d.variant} · ${esc(d.format)}</p></div>
    <div class="act"><select class="inp" id="edPick" aria-label="Chọn video" style="width:auto">${DRAFTS.filter(x=>x.status!=='failed').map(x=>`<option value="${x.id}" ${x.id===d.id?'selected':''}>${esc(P(x.product).name)} · ${x.variant}</option>`).join('')}</select>
    <button class="btn pri" data-act="edRender">${ic('refresh')}Dựng lại preview</button></div></div>
  <div class="card stack"><div class="lanes">
    <span></span><div class="ruler num">${Array.from({length:Math.floor(total/2)+1},(_,i)=>`<span style="left:${i*2/total*100}%">${i*2}s</span>`).join('')}</div>

/* ===================== router ===================== */
let route='dashboard';
function render(){
  route=(location.hash.slice(1)||'dashboard'); if(!V[route])route='dashboard';
  if(route!=='inbox')stopPlay();
  renderNav(route);renderTop();
  document.getElementById('view').innerHTML=V[route]();
  document.getElementById('layer').innerHTML=S.drawer&&route==='channel-edit'?drawerHtml():'';
  document.getElementById('side').classList.remove('open');
}
function rerender(){const y=window.scrollY;render();window.scrollTo(0,y)}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});

/* ---- phát video giả lập ---- */
function stopPlay(){S.playing=false;clearInterval(S.timer);S.timer=null}
function updatePhone(){
  const d=cur();if(!d||route!=='inbox')return;
  const total=d.scenes.reduce((a,s)=>a+s.dur,0);let acc=0,idx=0;
  for(let i=0;i<d.scenes.length;i++){if(S.t<acc+d.scenes[i].dur){idx=i;break}acc+=d.scenes[i].dur;idx=i}
  const q=id=>document.getElementById(id);
  if(idx!==S.scene){S.scene=idx;rerender();return}
  if(q('phBar'))q('phBar').style.width=(S.t/total*100)+'%';
  if(q('phTime'))q('phTime').textContent=`0:${String(Math.floor(S.t)).padStart(2,'0')} / 0:${String(total).padStart(2,'0')}`;
}
function togglePlay(){
  const d=cur();if(!d)return;
  if(S.playing){stopPlay();rerender();return}
  const total=d.scenes.reduce((a,s)=>a+s.dur,0);if(S.t>=total-0.1){S.t=0;S.scene=0}
  S.playing=true;rerender();
  S.timer=setInterval(()=>{S.t+=0.1;if(S.t>=total){S.t=total;stopPlay();rerender();return}updatePhone()},100);
}
function selectDraft(id){stopPlay();S.sel=id;S.scene=0;S.t=0;S.noteOpen=false;rerender()}
function step(dir){const l=inboxList();const i=l.findIndex(x=>x.id===S.sel);const n=l[Math.min(l.length-1,Math.max(0,i+dir))];if(n)selectDraft(n.id)}
function nextPending(){const l=inboxList().filter(x=>x.status==='pending_review');if(l[0])selectDraft(l[0].id);else rerender()}

  if(t.dataset.field){const p=prof(),k=t.dataset.field;p[k]=t.type==='number'?+t.value:t.value;S.dirty=true;refreshPrompt()}
  if(t.id==='prodQ'){S.prodQuery=t.value;const pos=t.selectionStart;rerender();const n=document.getElementById('prodQ');n.focus();n.setSelectionRange(pos,pos)}
  if(t.id==='ws-budget'){S.budget=+t.value;document.getElementById('budgetTxt').textContent=nf(S.budget)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='chSel'){S.channel=t.value;S.dirty=false;S.saveOpen=false;S.testState='idle';S.drawer=false;stopPlay();S.sel='';rerender()}
  if(t.dataset.fmt!==undefined){const p=prof();const f=t.dataset.fmt;p.formats=t.checked?[...p.formats,f]:p.formats.filter(x=>x!==f);S.dirty=true;refreshPrompt()}
  if(t.tagName==='SELECT'&&t.dataset.field){S.dirty=true;rerender()}
  if(t.id==='sampleP'){S.sampleProduct=t.value;S.testState='idle';rerender()}
  if(t.id==='fStatus'){S.filter.status=t.value;rerender()}
  if(t.id==='fFormat'){S.filter.format=t.value;rerender()}
  if(t.dataset.bprod){const b=S.batch;b.products=t.checked?[...b.products,t.dataset.bprod]:b.products.filter(x=>x!==t.dataset.bprod);rerender()}
  if(t.name==='bfmt'){S.batch.format=t.value}
  if(t.id==='edPick'){S.edDraft=t.value;S.edScene=0;rerender()}
  if(t.id==='np-files'){S.files=[...S.files,...t.files];rerender()}
  if(t.id==='es-voice'&&t.files[0])toast('Đã gắn giọng thu "'+t.files[0].name+'" cho cảnh '+(S.edScene+1))
});
function refreshPrompt(){
  const m=briefMeta(),pre=document.getElementById('promptPre');if(!pre)return;
  pre.textContent=m.txt;document.getElementById('tokTxt').textContent=`≈ ${m.tok} / 700 token`;document.getElementById('tokBar').style.width=m.pct+'%';
  const btn=document.querySelector('[data-act="saveOpen"]');if(btn)btn.disabled=false;
}
/* thẻ tag: Enter để thêm */
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.taginput&&e.key==='Enter'){e.preventDefault();const v=t.value.trim();if(!v)return;const arr=prof()[t.dataset.taginput];if(!arr.includes(v))arr.push(v);S.dirty=true;rerender();document.getElementById('tag-'+t.dataset.taginput).focus();return}
  if(t.classList&&t.classList.contains('ver')&&e.key==='Enter'){t.click();return}
  if(e.key==='Escape'&&S.drawer){S.drawer=false;rerender();return}
  if(route!=='inbox'||e.ctrlKey||e.metaKey||e.altKey)return;
  if(/INPUT|TEXTAREA|SELECT/.test(t.tagName))return;
  const k=e.key.toLowerCase();
  if(k==='a'){e.preventDefault();A.approve()} else if(k==='r'){e.preventDefault();A.reject()} else if(k==='n'){e.preventDefault();A.note()}
  else if(k==='j'){e.preventDefault();step(1)} else if(k==='k'){e.preventDefault();step(-1)} else if(k===' '){e.preventDefault();togglePlay()}
});
/* kéo thả file */
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(!d)return;e.preventDefault();S.files=[...S.files,...e.dataTransfer.files];rerender()});

render();
</script>
