# Production trên 1 VPS: postgres + api + worker + web + caddy (HTTPS, basic auth).
# Chạy tại /opt/vm:  docker compose up -d   (đọc biến từ /opt/vm/.env)
name: vm

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-app: &app
  image: ${IMAGE_APP:?đặt IMAGE_APP}:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file: .env
  volumes:
    - storage:/data/storage
  logging: *logging

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  STORAGE_DIR: /data/storage

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?đặt POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?đặt POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  api:
    <<: *app
    environment:
      <<: *app-env
      MIGRATE_ON_START: "true"
      API_PORT: "3000"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *app
    environment:
      <<: *app-env
    working_dir: /app/apps/worker
    command: ["node", "--import", "tsx", "src/main.ts"]
    # Worker chờ job đang chạy tối đa ~50s khi nhận SIGTERM.
    stop_grace_period: 60s
    depends_on:
      # api chạy migration lúc khởi động → worker đợi api healthy.
      api: { condition: service_healthy }

  web:
    image: ${IMAGE_WEB:?đặt IMAGE_WEB}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?đặt DOMAIN}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?đặt BASIC_AUTH_USER}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?đặt BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    logging: *logging

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
