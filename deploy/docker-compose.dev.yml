# Hạ tầng dev: Postgres + Temporal server + Temporal UI.
# api/worker/web vẫn chạy trực tiếp bằng pnpm dev:* — không đóng gói vào compose.
name: affilio-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-affilio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-affilio}
      POSTGRES_DB: ${POSTGRES_DB:-affilio}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Temporal server (dev): tự tạo schema + database `temporal`, `temporal_visibility`
  # trên Postgres ở trên.
  temporal:
    image: temporalio/auto-setup:1.29.7
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-affilio}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-affilio}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports:
      # 7233 là gRPC để worker/client ở máy host nối tới (temporal.io/sdk, @temporalio/client).
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  # Temporal Web UI: http://localhost:8233 (không dùng cổng 8080 để tránh đụng service khác).
  temporal-ui:
    image: temporalio/ui:2.58.1
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    ports:
      - "8233:8080"
    depends_on:
      - temporal

volumes:
  pgdata:
  temporaldata:
