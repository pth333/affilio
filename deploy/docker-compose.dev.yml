# Chỉ Postgres cho máy dev; api/worker/web chạy trực tiếp bằng pnpm dev:*.
name: affilio-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-affilio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-affilio}
      POSTGRES_DB: ${POSTGRES_DB:-affilio}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  # Temporal dev server (SQLite, kèm UI tại http://localhost:8233), namespace default có sẵn.
  temporal:
    image: temporalio/temporal:1.10.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporaldata:/data
volumes:
  pgdata:
  temporaldata:
