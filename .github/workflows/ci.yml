name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vm
          POSTGRES_PASSWORD: vm
          POSTGRES_DB: vm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vm -d vm_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://vm:vm@localhost:5432/vm_test
      TEST_DATABASE_URL: postgres://vm:vm@localhost:5432/vm_test
      NODE_ENV: test
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migration
        run: pnpm db:migrate
      - name: Kiểm tra migration khớp schema
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/core/drizzle || (echo "schema.ts đổi nhưng chưa chạy pnpm db:generate" && exit 1)
          test -z "$(git status --porcelain -- packages/core/drizzle)" || (echo "có migration mới chưa commit" && exit 1)
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image app (không push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Build image web (không push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
