name: Deploy

# Chạy khi CI trên main xanh, hoặc bấm tay.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_APP: ghcr.io/${{ github.repository }}-app
  IMAGE_WEB: ghcr.io/${{ github.repository }}-web

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        run: |
          echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          # Tên image GHCR phải viết thường.
          echo "IMAGE_APP=${IMAGE_APP,,}" >> "$GITHUB_ENV"
          echo "IMAGE_WEB=${IMAGE_WEB,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE_APP }}:${{ steps.meta.outputs.tag }},${{ env.IMAGE_APP }}:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.tag }},${{ env.IMAGE_WEB }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Chép file deploy lên VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/docker-compose.yml,deploy/Caddyfile,deploy/scripts/backup.sh
          target: /opt/affilio
          strip_components: 1
      - name: Pull image và khởi động lại
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TAG,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/affilio
            chmod +x scripts/backup.sh
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # Sao lưu trước khi chạy migration mới (bỏ qua ở lần deploy đầu khi chưa có DB).
            if docker compose ps --status running postgres | grep -q postgres; then ./scripts/backup.sh; fi
            export IMAGE_TAG="$TAG"
            docker compose pull api worker web
            docker compose up -d --remove-orphans
            docker image prune -f
            docker logout ghcr.io
            docker compose ps
